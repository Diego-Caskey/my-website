<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="STYLE_index.css">
    <link rel="stylesheet" href="STYLE_tavern.css">
    <title>Oracle of Seasons: Sprite Gallery</title>
</head>

<body>
    <header>
        <img src="images/OoS_Logo.png" alt="English logo for Zelda: Oracle of Seasons" height="250px">
        <div id="navbar">
            <div class="nav-dropdown">
                <button class="nav-dropdown-button">&#9660; MENU</button>
                <div class="nav-dropdown-content">
                    <a href="index.html" class="toc selectable-menu">- GO BACK</a>
                </div>
            </div>
            <span class="nav-title">USE THE <span class="red-text">CONTROLS</span> TO PLAY</span>
        </div>
    </header>

    <main>
        <div id="tavern-screen">
            <img id="link-avatar" src="gifs/LinkWalkDown.gif" alt="Link avatar">
            <div id="dialogue-box" class="hidden bottom">
                <p id="dialogue-text"></p>
                <div id="yn-picker" class="hidden">
                    <span class="yn-option selected" data-value="yes">YES</span>
                    <span class="yn-option" data-value="no">NO</span>
                </div>
                <div id="baby-yn-picker" class="hidden">
                    <span class="yn-option selected" data-value="yes">Goo?</span>
                    <span class="yn-option" data-value="no">Gah!</span>
                </div>
            </div>
        </div>

        <div id="controls">
            <div id="dpad">
                <button id="btnUp" class="ctrl-btn dpad-up">▲</button>
                <button id="btnLeft" class="ctrl-btn dpad-left">◄</button>
                <button id="btnDown" class="ctrl-btn dpad-down">▼</button>
                <button id="btnRight" class="ctrl-btn dpad-right">►</button>
            </div>
            <div id="action-buttons">
                <button id="btnB" class="ctrl-btn action-btn">B</button>
                <button id="btnA" class="ctrl-btn action-btn">A</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; Diego Caskey 2026</p>
    </footer>

    <!-- Sound Effects Stored In "sounds" Folder -->
    <audio id="entrySound" src="sounds/Oracle_Stairs.wav" autoplay></audio>
    <audio id="hoverSound" src="sounds/Oracle_Text_Letter.wav"></audio>
    <audio id="flipSound" src="sounds/Oracle_Text_Done.wav"></audio>
    <audio id="cursorSound" src="sounds/Oracle_Menu_Cursor.wav"></audio>
    <audio id="menuOpenSound" src="sounds/Oracle_PauseMenu_Open.wav"></audio>
    <audio id="menuCloseSound" src="sounds/Oracle_PauseMenu_Close.wav"></audio>
    <audio id="bgMusic" src="sounds/WitchHut.mp3" loop autoplay></audio>

    <!-- JS to enable menu functionality -->
    <script>
        const menuOpenSound = document.getElementById('menuOpenSound');
        const menuCloseSound = document.getElementById('menuCloseSound');
        const dropdown = document.querySelector('.nav-dropdown');


        dropdown.addEventListener('mouseenter', () => {
            menuOpenSound.currentTime = 0;
            menuOpenSound.play();
        });

        dropdown.addEventListener('mouseleave', () => {
            menuCloseSound.currentTime = 0;
            menuCloseSound.play();
        });
    </script>

    <!-- JS to enable...everything -->
    <script>
        const linkAvatar = document.getElementById('link-avatar');

        // === ADD AVATAR SPRITES ===
        const sprites = {
            up: 'gifs/LinkWalkUp.gif',
            down: 'gifs/LinkWalkDown.gif',
            left: 'gifs/LinkWalkLeft.gif',
            right: 'gifs/LinkWalkRight.gif'
        };

        const pushSprites = {
            up: 'gifs/LinkPushUp.gif',
            down: 'gifs/LinkPushDown.gif',
            left: 'gifs/LinkPushLeft.gif',
            right: 'gifs/LinkPushRight.gif'
        };

        const babySprites = {
            up: 'gifs/LinkBabyUp.gif',
            down: 'gifs/LinkBabyDown.gif',
            left: 'gifs/LinkBabyLeft.gif',
            right: 'gifs/LinkBabyRight.gif'
        };

        // === ADD TRIGGERABLE SOUND ===
        const itemFanfare = new Audio('sounds/Oracle_Fanfare_Item.wav');
        const fanfareEssence = new Audio('sounds/Oracle_Fanfare_Essence.wav');
        const appearVanish = new Audio('sounds/Oracle_AppearVanish.wav');
        const textBlip = new Audio('sounds/Oracle_Text_Letter.wav');
        const cursorBlip = new Audio('sounds/Oracle_Menu_Cursor.wav');
        const textDone = new Audio('sounds/Oracle_Text_Done.wav');
        const linkRun = new Audio('sounds/Oracle_Link_LandRun.wav');
        const linkBabyCrawl = new Audio('sounds/Oracle_Link_BabyCrawl.wav');
        const errorSound = new Audio('sounds/Oracle_Error.wav');
        const wallBump = new Audio('sounds/Oracle_Bomb_Drop.wav');

        const GRID_W = 10;
        const GRID_H = 8;
        const PUSH_DURATION = 500;

        // === CONFIGURE BLOCKED TILES ===
        const MAP = [
            '##########',  // A
            '##########',  // B
            '#......##.',  // C
            '#.###.####',  // D
            '#.......##',  // E
            '#.##.....#',  // F
            '#.....##.#',  // G
            '##########'   // H
        ];

        // === ADD CONST STATE ===
        const state = {
            x: 6,
            y: 6,
            facing: 'down',
            pushing: false,
            isBaby: false,
            itemHeld: null,
            bushSearched: false,
            gotSoup: false,
            gotFlute: false,
            itemPickupActive: false,
            metDimitri: false,
            witchTalkCount: 0,
            mapleTalkCount: 0,
            mapleFavor: null,
            zeldaTalkCount: 0,
            drunkTalkCount: 0,
            soupYelledAt: false,
            potionConsumed: false,
            dialogueActive: false,
            dialogueTyping: false,
            dialogueAwaitingAdvance: false,
            dialogueAdvanceCallback: null,
            ynActive: false,
            ynChoice: 'yes',
            ynCallback: null
        };

        let pushTimer = null;
        let itemTimer = null;

        // (Resets NPC talk counters at the beginning of each event)
        function resetTalkCounts() {
            state.witchTalkCount = 0;
            state.mapleTalkCount = 0;
            state.zeldaTalkCount = 0;
            state.drunkTalkCount = 0;
            state.mapleFavor = null;
        }

        // === DIALOGUE SYSTEM ===
        const dialogueBox = document.getElementById('dialogue-box');
        const dialogueText = document.getElementById('dialogue-text');
        const ynPicker = document.getElementById('yn-picker');

        let typewriterTimer = null;

        // (Turns {Example Text} into red text)
        function parseDialogueText(text) {
            const segments = [];
            let i = 0;
            while (i < text.length) {
                if (text[i] === '{') {
                    const close = text.indexOf('}', i);
                    if (close !== -1) {
                        segments.push({ text: text.slice(i + 1, close), red: true });
                        i = close + 1;
                        continue;
                    }
                }
                const next = text.indexOf('{', i);
                const end = next === -1 ? text.length : next;
                segments.push({ text: text.slice(i, end), red: false });
                i = end;
            }
            return segments;
        }

        // (Chooses top or bottom based on Link's y position)
        function pickDialoguePosition() {
            return state.y >= 5 ? 'top' : 'bottom';
        }

        // (Typewriter functionality)
        function renderTypewriterText(segments, charIndex) {
            let html = '';
            let remaining = charIndex;
            for (const seg of segments) {
                if (remaining <= 0) break;
                const sliceLen = Math.min(seg.text.length, remaining);
                const piece = seg.text.slice(0, sliceLen);
                if (seg.red) {
                    html += `<span class="dialogue-red">${escapeHTML(piece)}</span>`;
                } else {
                    html += escapeHTML(piece);
                }
                remaining -= sliceLen;
            }
            dialogueText.innerHTML = html;
        }

        function escapeHTML(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function totalLength(segments) {
            return segments.reduce((sum, s) => sum + s.text.length, 0);
        }

        // (Shows an array dialogue lines. On finish, calls onDone)
        function showDialogue(textOrLines, onDone, options = {}) {
            const lines = Array.isArray(textOrLines) ? textOrLines : [textOrLines];
            const keepOpen = options.keepOpen === true;
            state.dialogueActive = true;
            state.dialogueTyping = true;
            state.dialogueAwaitingAdvance = false;
            state.dialogueAdvanceCallback = null;
            clearTimeout(typewriterTimer);

            const position = pickDialoguePosition();
            dialogueBox.classList.remove('hidden', 'top', 'bottom');
            dialogueBox.classList.add(position);

            let lineIdx = 0;

            function playLine() {
                const segments = parseDialogueText(lines[lineIdx]);
                const total = totalLength(segments);
                let charIndex = 0;
                state.dialogueTyping = true;
                state.dialogueAwaitingAdvance = false;

                function tick() {
                    charIndex++;
                    renderTypewriterText(segments, charIndex);
                    if (charIndex % 2 === 0) {
                        textBlip.currentTime = 0;
                        textBlip.play().catch(() => { });
                    }
                    if (charIndex < total) {
                        typewriterTimer = setTimeout(tick, 35);
                    } else {
                        state.dialogueTyping = false;
                        const isLastLine = lineIdx === lines.length - 1;

                        if (isLastLine && keepOpen) {
                            // Final line, no advance needed — fire onDone immediately
                            // but leave the dialogue box on screen
                            if (onDone) onDone();
                            return;
                        }

                        state.dialogueAwaitingAdvance = true;
                        state.dialogueAdvanceCallback = () => {
                            lineIdx++;
                            if (lineIdx < lines.length) {
                                playLine();
                            } else {
                                closeDialogue();
                                if (onDone) onDone();
                            }
                        };
                    }
                }
                tick();
            }

            playLine();
        }

        function closeDialogue() {
            clearTimeout(typewriterTimer);
            dialogueBox.classList.add('hidden');
            state.dialogueActive = false;
        }

        // === Y/N PICKER ===
        function showYNPicker(callback) {
            state.ynActive = true;
            state.ynChoice = 'yes';
            state.ynCallback = callback;
            ynPicker.classList.remove('hidden');
            updateYNHighlight();
        }

        function updateYNHighlight() {
            ynPicker.querySelectorAll('.yn-option').forEach(el => {
                el.classList.toggle('selected', el.dataset.value === state.ynChoice);
            });
        }

        function closeYNPicker() {
            ynPicker.classList.add('hidden');
            state.ynActive = false;
        }

        // Get item cutcenes
        function showItem(filename, duration) {
            clearTimeout(itemTimer);
            state.itemHeld = filename;
            state.itemPickupActive = true;
            render();
            itemTimer = setTimeout(() => {
                if (state.itemHeld === filename) {
                    state.itemHeld = null;
                    state.itemPickupActive = false;
                    render();
                }
            }, duration);
        }

        const babyYnPicker = document.getElementById('baby-yn-picker');

        function showBabyYNPicker(callback) {
            state.ynActive = true;
            state.ynChoice = 'yes';
            state.ynCallback = callback;
            babyYnPicker.classList.remove('hidden');
            updateBabyYNHighlight();
        }

        function updateBabyYNHighlight() {
            babyYnPicker.querySelectorAll('.yn-option').forEach(el => {
                el.classList.toggle('selected', el.dataset.value === state.ynChoice);
            });
        }

        function closeBabyYNPicker() {
            babyYnPicker.classList.add('hidden');
            state.ynActive = false;
        }

        // === MOVEMENT & RENDER ===
        function isBlocked(x, y) {
            if (x < 1 || x > GRID_W || y < 1 || y > GRID_H) return true;
            // Potion tile (8,7) is walkable whenever the potion is gone
            if (state.potionConsumed && x === 8 && y === 7) return false;
            return MAP[y - 1][x - 1] === '#';
        }

        function render() {
            linkAvatar.style.gridColumn = state.x;
            linkAvatar.style.gridRow = state.y;

            let src;
            if (state.itemHeld) {
                src = state.itemHeld;
            } else if (state.isBaby) {
                src = babySprites[state.facing];
            } else if (state.pushing) {
                src = pushSprites[state.facing];
            } else {
                src = sprites[state.facing];
            }
            linkAvatar.src = src;
        }

        function move(direction) {
            if (state.itemPickupActive) return;

            // Y/N picker handles left/right even while dialogue box is open
            if (state.ynActive) {
                if (direction === 'left' || direction === 'right') {
                    state.ynChoice = state.ynChoice === 'yes' ? 'no' : 'yes';
                    cursorBlip.currentTime = 0;
                    cursorBlip.play().catch(() => { });
                    updateYNHighlight();
                    updateBabyYNHighlight();
                }
                return;
            }

            if (state.dialogueActive) return;

            state.facing = direction;
            let newX = state.x;
            let newY = state.y;
            if (direction === 'up') newY--;
            if (direction === 'down') newY++;
            if (direction === 'left') newX--;
            if (direction === 'right') newX++;

            if (isBlocked(newX, newY)) {
                state.pushing = true;
                wallBump.currentTime = 0;
                wallBump.play().catch(() => { });
                clearTimeout(pushTimer);
                pushTimer = setTimeout(() => {
                    state.pushing = false;
                    render();
                }, PUSH_DURATION);
            } else {
                state.x = newX;
                state.y = newY;
                state.pushing = false;
                clearTimeout(pushTimer);
                const stepSound = state.isBaby ? linkBabyCrawl : linkRun;
                stepSound.currentTime = 0;
                stepSound.play().catch(() => { });
            }
            render();
        }

        const tavernScreen = document.getElementById('tavern-screen');

        // === ADD EVENT TILE ===
        const events = {
            '2,2': searchBush,
            '8,3': talkToWitchC,
            '4,4': talkToDimitri,
            '5,4': talkToDimitri,
            '8,4': talkToWitchD,
            '9,5': talkToMaple,
            '3,6': tryEatSoup,
            '4,6': talkToZelda,
            '7,7': talkToSleepingMan,
            '8,7': drinkPotion
        };

        function setBackground(filename) {
            tavernScreen.style.backgroundImage = `url('gifs/${filename}')`;
        }

        // === SEARCH BUSH EVENT ===
        function searchBush() {
            if (state.isBaby) {
                errorSound.currentTime = 0;
                errorSound.play().catch(() => { });
                return;
            }
            if (state.bushSearched) return;
            showDialogue(
                [
                    "It's an oddly placed {bush}...",
                    "Search the bush?"
                ],
                () => {
                    showYNPicker((choice) => {
                        closeDialogue();
                        if (choice === 'yes') {
                            state.bushSearched = true;
                            resetTalkCounts();
                            itemFanfare.currentTime = 0;
                            itemFanfare.play();
                            showItem('gifs/LinkGetMushroom.png', 1500);
                        }
                        // 'no' → do nothing; player can re-trigger
                    });
                },
                { keepOpen: true }
            );
        }

        // === TRY SOUP EVENT ===
        function tryEatSoup() {
            if (!state.soupYelledAt) {
                state.soupYelledAt = true;
                showDialogue("Hey! That's my {mushroom soup}!");
            } else {
                errorSound.currentTime = 0;
                errorSound.play().catch(() => { });
            }
        }

        // === DRINK POTION EVENT ===
        function drinkPotion() {
            if (state.isBaby) return;
            if (state.potionConsumed) return;
            showDialogue(
                [
                    "It's a strange looking {potion}...",
                    "Take a sip?"
                ],
                () => {
                    showYNPicker((choice) => {
                        closeDialogue();
                        if (choice === 'yes') {
                            setBackground('TavernNoPotion.gif');
                            state.isBaby = true;
                            state.potionConsumed = true;
                            resetTalkCounts();
                            state.itemHeld = null;
                            appearVanish.currentTime = 0;
                            appearVanish.play();
                            render();
                        }
                    });
                },
                { keepOpen: true }
            );
        }

        // === CURE BABY EVENT ===
        function cureBabyLink() {
            state.isBaby = false;
            state.mapleFavor = 'no';
            const bg = state.gotFlute ? 'TavernDimitriHealedNoPotion.gif' : 'TavernNoPotion.gif';
            setBackground(bg);
            appearVanish.currentTime = 0;
            appearVanish.play();
            render();
        }

        // === ZELDA DIALOGUE FLOW ===
        function talkToZelda() {
            if (state.isBaby) {
                showDialogue(
                    "Why hello there! What can I do for you?",
                    () => {
                        showBabyYNPicker((choice) => {
                            closeDialogue();
                            if (choice === 'yes') {
                                showDialogue("Aww...you're so cute!");
                            } else {
                                showDialogue([
                                    "What's that? You drank a strange potion and now you're a baby?",
                                    "Maybe one of the workers can help you!"
                                ]);
                            }
                        });
                    },
                    { keepOpen: true }
                );
                return;
            }
            if (state.gotFlute) {
                showDialogue("Nom nom nom...");
                return;
            }
            if (state.bushSearched) {
                const lines = state.zeldaTalkCount === 0
                    ? ["That's...a nice {mushroom}..."]
                    : ["I don't want that..."];
                state.zeldaTalkCount++;
                showDialogue(lines);
                return;
            }
            if (state.metDimitri) {
                const lines = state.zeldaTalkCount === 0
                    ? [
                        "What's that? That creature wants {mushroom soup}?",
                        "Sorry...I bought the last one."
                    ]
                    : ["Maybe one of the {workers} can help you!"];
                state.zeldaTalkCount++;
                showDialogue(lines);
                return;
            }
            showDialogue("Yum! This {mushroom soup} is the best!");
        }

        // === WITCH DIALOGUE FLOW ===
        function talkToWitch() {
            if (state.isBaby) {
                showDialogue(
                    "How did you get in here?",
                    () => {
                        showBabyYNPicker((choice) => {
                            closeDialogue();
                            if (choice === 'yes') {
                                showDialogue(
                                    "You need an {antidote}? Alright here, drink this.",
                                    () => {
                                        cureBabyLink();
                                    }
                                );
                            } else {
                                showDialogue(
                                    ["Maple did what?", "My apologies dear, drink this {antidote}."],
                                    () => {
                                        cureBabyLink();
                                    }
                                );
                            }
                        });
                    },
                    { keepOpen: true }
                );
                return;
            }
            if (state.gotFlute) {
                showDialogue("Sorry. We're closing soon. No more orders.");
                return;
            }
            if (state.bushSearched && !state.gotSoup) {
                // Has mushroom — offer to make soup with Y/N picker
                showDialogue(
                    "Ah, that {mushroom}! I can make some {mushroom soup} with it! Do you want some?",
                    () => {
                        showYNPicker((choice) => {
                            closeDialogue();
                            if (choice === 'yes') {
                                state.gotSoup = true;
                                resetTalkCounts();
                                itemFanfare.currentTime = 0;
                                itemFanfare.play();
                                showItem('gifs/LinkGetSoup.png', 1500);
                            } else {
                                showDialogue("Oh...okay.");
                            }
                        });
                    },
                    { keepOpen: true }
                );
                return;
            }
            if (state.metDimitri && !state.bushSearched) {
                const lines = state.witchTalkCount === 0
                    ? ["You want {mushroom soup}? I'm out of {mushrooms}..."]
                    : ["If had a fresh {mushroom}, I could make more {soup}."];
                state.witchTalkCount++;
                showDialogue(lines);
                return;
            }
            if (state.gotSoup) {
                showDialogue("Hurry that {soup} over to {Dimitri}, dear!");
                return;
            }
            // Default (before meeting Dimitri)
            showDialogue("Ugh. That {Dodongo} just won't stop crying.");
        }

        function talkToWitchC() { talkToWitch(); }
        function talkToWitchD() { talkToWitch(); }

        // === DIMITRI DIALOGUE FLOW ===
        function talkToDimitri() {
            if (state.isBaby) {
                showDialogue("Sniff...no {soup}?");
                return;
            }
            if (state.gotFlute) {
                showDialogue("I feel amazing! Thanks again!");
                return;
            }
            if (state.gotSoup) {
                // Deliver soup cutscene
                state.gotFlute = true;
                resetTalkCounts();
                clearTimeout(itemTimer);
                state.itemHeld = null;
                render();
                setBackground('TavernEatSoup.gif');
                setTimeout(() => {
                    setBackground('TavernDimitriHealed.gif');
                    fanfareEssence.currentTime = 0;
                    fanfareEssence.play();
                    showItem('gifs/LinkGetFlute.png', 2500);
                    showDialogue("That was delicous! Take my {flute} as thanks.");
                }, 3000);
                return;
            }
            if (state.metDimitri && state.bushSearched) {
                showDialogue("Sniff...{mushroom}...{soup}...");
                return;
            }
            if (state.metDimitri) {
                showDialogue("Sniff...{mushroom}...{soup}...");
                return;
            }
            // First interaction
            state.metDimitri = true;
            resetTalkCounts();
            showDialogue([
                "Waaaaah! Sniff...sniff...",
                "I'm all out of {mushroom soup}!"
            ]);
        }

        // === MAPLE DIALOGUE FLOW ===
        function talkToMaple() {
            if (state.isBaby) {
                showDialogue(
                    "Kekeke, looks like it worked!",
                    () => {
                        showBabyYNPicker((choice) => {
                            closeDialogue();
                            if (choice === 'yes') {
                                showDialogue([
                                    "An {antidote}? Sorry. I'm not allowed to use the cauldron right now...",
                                    "Maybe {Master Syrup} can make one for you?"
                                ]);
                            } else {
                                showDialogue([
                                    "Oh right. The {mushroom} is in the {bush}.",
                                    "Good luck getting it in that form."
                                ]);
                            }
                        });
                    },
                    { keepOpen: true }
                );
                return;
            }
            if (state.mapleFavor === 'no') {
                showDialogue("Hmph...");
                return;
            }
            if (state.gotFlute) {
                mapleFavorLoop();
                return;
            }
            if (state.gotSoup) {
                mapleFavorLoop();
                return;
            }
            if (state.bushSearched) {
                const lines = state.mapleTalkCount === 0
                    ? ["Darn. You found it..."]
                    : ["Well. You can still try that {potion}! Kekeke."];
                state.mapleTalkCount++;
                showDialogue(lines);
                return;
            }
            if (state.metDimitri) {
                const lines = state.mapleTalkCount === 0
                    ? [
                        "You need {mushroom soup}? Well...",
                        "If you drink that {potion} over there I'll give you a {mushroom}!"
                    ]
                    : ["Come on, just a little sip!"];
                state.mapleTalkCount++;
                showDialogue(lines);
                return;
            }
            showDialogue("Hehe. I can't wait to test out my new {potion}!");
        }

        function mapleFavorLoop() {
            // Tracks favor-loop state via state.mapleFavor:
            //   undefined / null → first ask, show Y/N
            //   'yes' → repeats "Go on..." until something resets
            //   'no'  → repeats "Hmph..." until something resets
            if (state.mapleFavor === 'yes') {
                showDialogue("Go on...");
                return;
            }
            if (state.mapleFavor === 'no') {
                showDialogue("Hmph...");
                return;
            }
            // First time entering favor loop — ask
            showDialogue(
                "Hey...could you do me a favor?",
                () => {
                    showYNPicker((choice) => {
                        closeDialogue();
                        if (choice === 'yes') {
                            state.mapleFavor = 'yes';
                            showDialogue([
                                "You see that {potion} over there?",
                                "Could you give it a little {taste} for me?"
                            ]);
                        } else {
                            state.mapleFavor = 'no';
                            showDialogue("Tsk...fine.");
                        }
                    });
                },
                { keepOpen: true }
            );
        }

        // === SLEEPING MAN DIALOGUE FLOW ===
        function talkToSleepingMan() {
            if (state.isBaby) {
                const lines = ["{Drinking}...zzz.", "{Bad}...zzz.", "{Retry}...zzz."];
                showDialogue(lines[state.drunkTalkCount % lines.length]);
                state.drunkTalkCount++;
                return;
            }
            if (state.metDimitri) {
                const lines = ["{Mush}...zzz", "{Room}...zzz", "{Bush}...zzz"];
                showDialogue(lines[state.drunkTalkCount % lines.length]);
                state.drunkTalkCount++;
                return;
            }
            showDialogue("Zzz...");
        }

        // === BUTTON FUNCTIONALITY ===
        document.getElementById('btnUp').addEventListener('click', () => move('up'));
        document.getElementById('btnDown').addEventListener('click', () => move('down'));
        document.getElementById('btnLeft').addEventListener('click', () => move('left'));
        document.getElementById('btnRight').addEventListener('click', () => move('right'));

        document.getElementById('btnA').addEventListener('click', () => {
            if (state.itemPickupActive) return;

            // Y/N confirmation — must come BEFORE dialogue checks
            if (state.ynActive) {
                const choice = state.ynChoice;
                const cb = state.ynCallback;
                closeYNPicker();
                closeBabyYNPicker();
                textDone.currentTime = 0;
                textDone.play().catch(() => { });
                if (cb) cb(choice);
                return;
            }

            // Advance dialogue if it's waiting for a press
            if (state.dialogueAwaitingAdvance) {
                const cb = state.dialogueAdvanceCallback;
                state.dialogueAwaitingAdvance = false;
                state.dialogueAdvanceCallback = null;
                textDone.currentTime = 0;
                textDone.play().catch(() => { });
                if (cb) cb();
                return;
            }

            // If dialogue is still typing, ignore presses entirely
            if (state.dialogueActive) return;

            // Normal event trigger
            let tx = state.x;
            let ty = state.y;
            if (state.facing === 'up') ty--;
            if (state.facing === 'down') ty++;
            if (state.facing === 'left') tx--;
            if (state.facing === 'right') tx++;
            const event = events[`${tx},${ty}`];
            if (event) event();
        });

        document.getElementById('btnB').addEventListener('click', () => {
            if (state.itemPickupActive) return;
            if (state.ynActive) {
                const cb = state.ynCallback;
                closeYNPicker();
                closeBabyYNPicker();
                if (cb) cb('no');
                return;
            }
            if (state.dialogueActive) return;
        });

        render();
    </script>

    <!-- RESPONSIVE SCALING -->
    <script>
        const mainEl = document.querySelector('main');
        const DESIGN_WIDTH = 1300; // tavern (1200) + a bit of breathing room for padding

        function fitMainToViewport() {
            const availableWidth = window.innerWidth;
            const availableHeight = window.innerHeight - 200; // reserve room for header/footer
            const scaleByWidth = availableWidth / DESIGN_WIDTH;
            const scaleByHeight = availableHeight / 1400; // approximate content height (tavern + controls)
            const scale = Math.min(scaleByWidth, scaleByHeight, 1); // never scale above 1
            mainEl.style.transform = `scale(${scale})`;
        }

        window.addEventListener('resize', fitMainToViewport);
        fitMainToViewport();
    </script>

    <!-- JS to enable background music -->
    <script>
        const bgMusic = document.getElementById('bgMusic');
        bgMusic.volume = 0.5;
        document.addEventListener('click', () => {
            if (bgMusic.paused) bgMusic.play();
        }, { once: true });
    </script>
</body>
