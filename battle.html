<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="STYLE_index.css">
    <link rel="stylesheet" href="STYLE_battle.css">
    <title>Oracle of Seasons: Turn Based RPG</title>
</head>

<body>
    <header>
        <img src="images/OoS_Logo.png" alt="English logo for Zelda: Oracle of Seasons">
        <div id="navbar">
            <div class="nav-dropdown">
                <button class="nav-dropdown-button">&#9660; MENU</button>
                <div class="nav-dropdown-content">
                    <a href="index.html" class="toc selectable-menu">- GO BACK</a>
                </div>
            </div>
            <span class="nav-title">USE THE <span class="red-text">UI</span> TO PLAY</span>
        </div>
    </header>

    <main>
        <div id="battle-scene">
            <div id="hero-1">
                <img id="h1-sprite" class="hero" src="gifs/LinkWalkRight.gif" alt="Link">
                <div class="hp-bar"></div>
                <div class="turn-menu">
                    <div id="menu-lvl-start" class="menu-lvl">
                        <button class="attack selected" data-value="atk">ATTACK</button>
                        <button class="skill" data-value="skl">SKILL</button>
                    </div>
                    <div id="menu-lvl-atk" class="menu-lvl">
                        <button id="attack-b" class="atk-option" data-value="back">&#9664;</button>
                        <button id="attack-1" class="atk-option selected" data-value="atk1">SLASH</button>
                        <button id="attack-2" class="atk-option" data-value="atk2">STAB</button>
                    </div>
                    <div id="menu-lvl-skl" class="menu-lvl">
                        <button id="skill-b" class="skl-option" data-value="back">&#9664;</button>
                        <button id="skill-1" class="skl-option selected" data-value="skl1">SPIN ATTACK</button>
                        <button id="skill-2" class="skl-option" data-value="skl2">PLAY FLUTE</button>
                    </div>
                </div>
            </div>
            <img id="hero-2" class="hero" src="gifs/DimitriWalkRight.gif" alt="Dimitri">
            <img id="hero-3" class="hero" src="gifs/DinWalkRight.gif" alt="Din">
            <img id="enemy-1" class="enemy" src="gifs/DarknutIdle.gif" alt="Darknut">
            <img id="enemy-2" class="enemy" src="gifs/MoblinIdle.gif" alt="Moblin">
            <img id="enemy-3" class="enemy" src="gifs/MoblinIdle.gif" alt="Moblin">
        </div>
        <div id="combat-controls"></div>
    </main>

    <footer>
        <p>&copy; Diego Caskey 2026</p>
    </footer>

    <!-- Sound Effects Stored In "sounds" Folder -->
    <audio id="entrySound" src="sounds/Oracle_Stairs.wav" autoplay></audio>
    <audio id="hoverSound" src="sounds/Oracle_Text_Letter.wav"></audio>
    <audio id="flipSound" src="sounds/Oracle_Text_Done.wav"></audio>
    <audio id="cursorSound" src="sounds/Oracle_Menu_Cursor.wav"></audio>
    <audio id="menuOpenSound" src="sounds/Oracle_PauseMenu_Open.wav"></audio>
    <audio id="menuCloseSound" src="sounds/Oracle_PauseMenu_Close.wav"></audio>

    <!-- JS to enable menu functionality -->
    <script>
        const menuOpenSound = document.getElementById('menuOpenSound');
        const menuCloseSound = document.getElementById('menuCloseSound');
        const dropdown = document.querySelector('.nav-dropdown');

        dropdown.addEventListener('mouseenter', () => {
            menuOpenSound.currentTime = 0;
            menuOpenSound.play();
        });

        dropdown.addEventListener('mouseleave', () => {
            menuCloseSound.currentTime = 0;
            menuCloseSound.play();
        });
    </script>
</body>

</html>
